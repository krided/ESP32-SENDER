name: iOS Unsigned (Flutter)

on:
  workflow_dispatch:
  push:
    paths:
      - 'flutter-app/**'
      - '.github/workflows/ios_unsigned.yml'

jobs:
  build-ios-unsigned:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter tools check
        run: |
          flutter --version
          dart --version
          flutter doctor -v
          flutter precache --ios
          flutter pub get

      - name: Xcode & CocoaPods versions
        run: |
          xcodebuild -version
          pod --version || true

      - name: Ensure iOS platform folder exists
        run: |
          if [ ! -d ios ]; then
            flutter create .
          fi

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod repo update
          pod install
          cd ..

      - name: Inject Bluetooth permissions into Info.plist
        run: |
          INFO_PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string This app needs Bluetooth to connect to your E46 Speeduino engine monitor" "$INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string This app needs Bluetooth to connect to your E46 Speeduino engine monitor" "$INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" "$INFO_PLIST" || true

      - name: Build iOS (no codesign, verbose)
        run: |
          flutter clean
          flutter build ios --release --no-codesign -v

      - name: Package unsigned .ipa
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          DEST_DIR="build/ios/unsigned"
          mkdir -p "$DEST_DIR/Payload"
          cp -R "$APP_PATH" "$DEST_DIR/Payload/Runner.app"
          (cd "$DEST_DIR" && zip -9 -r "E46-Speeduino-unsigned.ipa" Payload)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: E46-Speeduino-unsigned
          path: flutter-app/build/ios/unsigned/E46-Speeduino-unsigned.ipa

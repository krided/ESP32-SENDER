<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#001336">
    <title>E46 Speeduino Monitor</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #000001 0%, #001336 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 10px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #FC0000;
            transition: background 0.3s;
        }

        .status-dot.connected {
            background: #15A449;
        }

        .connect-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
            padding: 14px;
            background: #15A449;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .connect-btn:hover {
            background: #0f7a34;
        }

        .connect-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .gauges {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .gauge {
            background: rgba(0, 0, 0, 0.16);
            border: 1px solid rgba(10, 255, 0, 0.62);
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
            transition: all 0.3s;
        }

        .gauge.warning {
            background: rgba(241, 0, 0, 0.88);
            border-color: #B60000;
            animation: pulse 0.9s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .gauge-label {
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.8;
            margin-bottom: 6px;
        }

        .gauge-value {
            font-size: 32px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 2px;
        }

        .gauge-unit {
            font-size: 12px;
            opacity: 0.7;
        }

        .info-section {
            background: rgba(0, 0, 0, 0.33);
            border: 1px solid rgba(17, 224, 15, 0.77);
            border-radius: 12px;
            overflow: hidden;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(8, 204, 0, 0.8);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            opacity: 0.8;
            font-size: 14px;
        }

        .info-value {
            font-weight: bold;
            font-size: 14px;
        }

        .warning-box {
            background: rgba(252, 0, 0, 0.2);
            border: 1px solid #FC0000;
            border-radius: 8px;
            padding: 12px;
            margin: 15px 0;
            display: none;
        }

        .warning-box.show {
            display: block;
        }

        .warning-box p {
            margin: 5px 0;
            font-size: 13px;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            opacity: 0.5;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Engine Monitor</h1>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <div class="status" style="margin-top: 5px; font-size: 0.85em;">
                <div class="status-dot" id="espnowStatusDot"></div>
                <span id="espnowStatusText">Speeduino: Waiting...</span>
                <span id="packetsCount" style="margin-left: 10px; opacity: 0.7;"></span>
            </div>
        </header>

        <button class="connect-btn" id="connectBtn">Connect to E46 Speeduino</button>

        <div class="warning-box" id="warningBox">
            <p><strong>⚠️ Uwaga:</strong></p>
            <p id="warningText"></p>
        </div>

        <div class="gauges">
            <div class="gauge" id="gRpm">
                <div class="gauge-label">RPM</div>
                <div class="gauge-value" id="vRpm">0</div>
                <div class="gauge-unit">rev/min</div>
            </div>
            <div class="gauge" id="gClt">
                <div class="gauge-label">Coolant</div>
                <div class="gauge-value" id="vClt">0</div>
                <div class="gauge-unit">°C</div>
            </div>
            <div class="gauge" id="gTps">
                <div class="gauge-label">Throttle</div>
                <div class="gauge-value" id="vTps">0</div>
                <div class="gauge-unit">%</div>
            </div>
            <div class="gauge" id="gMap">
                <div class="gauge-label">MAP</div>
                <div class="gauge-value" id="vMap">0</div>
                <div class="gauge-unit">BAR</div>
            </div>
            <div class="gauge" id="gBattery">
                <div class="gauge-label">Battery</div>
                <div class="gauge-value" id="vBattery">0.0</div>
                <div class="gauge-unit">V</div>
            </div>
            <div class="gauge" id="gAdvance">
                <div class="gauge-label">Advance</div>
                <div class="gauge-value" id="vAdvance">0</div>
                <div class="gauge-unit">°</div>
            </div>
        </div>

        <div class="info-section">
            <div class="info-row">
                <span class="info-label">IAT:</span>
                <span class="info-value" id="vIat">0°C</span>
            </div>
            <div class="info-row">
                <span class="info-label">Pulse Width:</span>
                <span class="info-value" id="vPw">0.00 ms</span>
            </div>
            <div class="info-row">
                <span class="info-label">AFR:</span>
                <span class="info-value" id="vO2">0.00</span>
            </div>
            <div class="info-row">
                <span class="info-label">Boost Duty:</span>
                <span class="info-value" id="vBoostDuty">0%</span>
            </div>
            <div class="info-row">
                <span class="info-label">Boost Target:</span>
                <span class="info-value" id="vBoostTarget">0.00 BAR</span>
            </div>
        </div>

        <footer>
            <p>E46 Speeduino BLE Monitor • PWA</p>
        </footer>
    </div>

    <script>
        const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const CHAR_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

        let device = null;
        let characteristic = null;
        let connected = false;
        let lastDataUpdate = 0;

        const elements = {
            connectBtn: document.getElementById('connectBtn'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            warningBox: document.getElementById('warningBox'),
            warningText: document.getElementById('warningText'),
            vRpm: document.getElementById('vRpm'),
            vClt: document.getElementById('vClt'),
            vTps: document.getElementById('vTps'),
            vMap: document.getElementById('vMap'),
            vBattery: document.getElementById('vBattery'),
            vAdvance: document.getElementById('vAdvance'),
            vIat: document.getElementById('vIat'),
            vPw: document.getElementById('vPw'),
            vO2: document.getElementById('vO2'),
            vBoostDuty: document.getElementById('vBoostDuty'),
            vBoostTarget: document.getElementById('vBoostTarget'),
            gRpm: document.getElementById('gRpm'),
            gClt: document.getElementById('gClt'),
            gTps: document.getElementById('gTps'),
            gMap: document.getElementById('gMap'),
            gAdvance: document.getElementById('gAdvance'),
        };

        // Check Web Bluetooth support
        if (!navigator.bluetooth) {
            elements.warningBox.classList.add('show');
            elements.warningText.innerHTML = 
                'Web Bluetooth nie jest obsługiwany w tej przeglądarce.<br>' +
                '<strong>Windows/Mac/Linux:</strong> Użyj Chrome, Edge lub Opera.<br>' +
                '<strong>iPhone:</strong> Pobierz Bluefy Browser z App Store.';
            elements.connectBtn.disabled = true;
        }

        elements.connectBtn.addEventListener('click', async () => {
            if (connected) {
                disconnect();
                return;
            }

            try {
                setStatus('Scanning...');
                elements.connectBtn.disabled = true;

                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'E46 Speeduino' }],
                    optionalServices: [SERVICE_UUID]
                });

                device.addEventListener('gattserverdisconnected', onDisconnected);

                setStatus('Connecting...');
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHAR_UUID);

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);

                connected = true;
                setStatus('Connected', true);
                elements.connectBtn.textContent = 'Disconnect';
                elements.connectBtn.disabled = false;

            } catch (error) {
                console.error('Connection error:', error);
                setStatus('Connection failed: ' + error.message);
                elements.connectBtn.disabled = false;
            }
        });

        function handleData(event) {
            try {
                const text = new TextDecoder().decode(event.target.value);
                const data = JSON.parse(text);
                lastDataUpdate = Date.now();

                // Update ESP-NOW status
                if (data.espnowConnected !== undefined) {
                    const espnowConnected = data.espnowConnected;
                    elements.espnowStatusDot.classList.toggle('connected', espnowConnected);
                    elements.espnowStatusText.textContent = espnowConnected ? 
                        'Speeduino: Connected' : 'Speeduino: No Data';
                    
                    if (data.packetsReceived !== undefined) {
                        elements.packetsCount.textContent = `📦 ${data.packetsReceived}`;
                    }
                }

                // Display converted values from firmware
                elements.vRpm.textContent = data.rpm || 0;
                elements.vClt.textContent = data.clt || 0;  // Already in °C
                elements.vTps.textContent = (data.tps || 0).toFixed(1);  // %
                elements.vMap.textContent = (data.map || 0).toFixed(2); // Already gauge pressure in BAR
                elements.vBattery.textContent = (data.battery || 0).toFixed(1);  // V
                elements.vAdvance.textContent = data.advance || 0;  // °

                // Update info
                elements.vIat.textContent = (data.iat || 0) + '°C';
                elements.vPw.textContent = (data.pulsewidth || 0).toFixed(2) + ' ms';
                elements.vO2.textContent = (data.o2 || 0).toFixed(2);  // AFR
                elements.vBoostDuty.textContent = (data.boostDuty || 0) + '%';
                elements.vBoostTarget.textContent = (data.boostTarget || 0).toFixed(2) + ' BAR';

                // Check warnings
                elements.gRpm.classList.toggle('warning', data.rpm >= (data.wrpm || 6800));
                elements.gClt.classList.toggle('warning', data.clt >= (data.wclt || 95));
                elements.gTps.classList.toggle('warning', data.tps >= (data.wtps || 95));
                // Warning for MAP is based on absolute kPa from firmware
                elements.gMap.classList.toggle('warning', (data.map + 1) * 100 >= (data.wmap || 250));
                elements.gAdvance.classList.toggle('warning', data.advance >= (data.wadvance || 35));

            } catch (error) {
                console.error('Data parse error:', error);
            }
        }

        function setStatus(text, isConnected = false) {
            elements.statusText.textContent = text;
            elements.statusDot.classList.toggle('connected', isConnected);
        }

        function disconnect() {
            if (device && device.gatt.connected) {
                device.gatt.disconnect();
            }
            onDisconnected();
        }

        function onDisconnected() {
            connected = false;
            setStatus('Disconnected');
            elements.connectBtn.textContent = 'Connect to E46 Speeduino';
            elements.connectBtn.disabled = false;
        }

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
